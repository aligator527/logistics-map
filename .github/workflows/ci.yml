# Type check, data tests (published JSON vs. hand-verified official figures) and build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # the tests import src/lib/*.ts directly (Node's built-in type stripping)
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
