# Type check, data tests (published JSON vs. hand-verified official figures), build, and
# end-to-end checks of the built site in a browser (desktop and phone, light and dark, axe).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # after visual-baselines.yml commits new snapshots (its push does not start CI)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # the tests import src/lib/*.ts directly (Node's built-in type stripping)
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  visual:
    # screenshot comparison, in the same container as the baselines (skipped until they exist)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      - run: |
          if [ -d e2e/visual.spec.ts-snapshots ]; then npx playwright test e2e/visual.spec.ts
          else echo "no baselines yet: run the 'Update visual baselines' workflow"; fi
        env:
          CI: '1'
          VISUAL: '1'
          HOME: /root
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: visual-diff
          path: test-results
          retention-days: 14
