# Daily news refresh: fetches the public feeds (scripts/fetch-news.mjs), commits
# public/data/news.json when it changed, then redeploys GitHub Pages.
# Commits made with GITHUB_TOKEN do not trigger other workflows, so the deploy is called here.
# Note: GitHub pauses schedules in repositories without activity for 60 days — re-enable in Actions.
name: Update news

on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # the fetcher only needs Node's fetch/TextDecoder: no npm install
      - run: node scripts/fetch-news.mjs
      - run: node scripts/check-data.mjs public/data/news.json
      - id: commit
        run: |
          if git diff --quiet -- public/data/news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/news.json
            git commit -m "Update news feed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
